services:
  foodtracker-webapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: foodtracker-webapi:latest
    container_name: foodtracker-webapi
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=jdbc:sqlite:/app/data/foodtracker.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - foodtracker-data:/app/data
    restart: unless-stopped

volumes:
  foodtracker-data:
    driver: local

